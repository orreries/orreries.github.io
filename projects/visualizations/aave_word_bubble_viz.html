<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAVE Word Bubble Viz — Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --background-color: #000000;
      --text-color: #f1f1f1;
      --link-color: #ea7af4;
      --font: Monaco, monospace;
      --heading-font: 'Handjet', monospace;
      --border: 2px solid #6a3eb7;
      --color-text-primary: #f1f1f1;
      --color-text-secondary: #b8a0d8;
      --color-border-primary: #6a3eb7;
      --color-border-secondary: rgba(106,62,183,0.5);
      --color-border-tertiary: rgba(106,62,183,0.3);
    }
    body {
      background: var(--background-color);
      background-image: url("https://orreries.github.io/images/bgstarz3.gif");
      color: var(--text-color);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }
    h1 {
      font-family: var(--heading-font);
      font-size: 2.2em;
      color: var(--link-color);
      margin-bottom: 4px;
    }
    .subtitle {
      color: var(--color-text-secondary);
      font-size: 0.75em;
      font-style: italic;
      margin-bottom: 24px;
    }
    .archive-notice {
      display: inline-block;
      font-size: 0.65em;
      border: 1px solid #6a3eb7;
      color: #ea7af4;
      padding: 2px 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      border: var(--border);
      padding: 20px;
      background: rgba(0,0,0,0.5);
    }

    /* ── VIZ ── */
    .aave-viz { font-family: Monaco, 'Courier New', monospace; padding: 0.5rem 0; color: var(--color-text-primary); }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 1rem; }
    .movie-btn { background: transparent; border: 1px solid var(--color-border-secondary); border-radius: 2px; padding: 4px 10px; font-family: Monaco, monospace; font-size: 11px; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .movie-btn:hover { border-color: #ea7af4; color: #ea7af4; }
    .movie-btn.active { background: rgba(106,62,183,0.25); border-color: #6a3eb7; color: #ea7af4; }
    .view-toggle { display: flex; border: 1px solid var(--color-border-secondary); border-radius: 2px; overflow: hidden; margin-left: auto; }
    .view-btn { background: transparent; border: none; padding: 5px 14px; font-family: Monaco, monospace; font-size: 11px; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
    .view-btn.active { background: rgba(106,62,183,0.3); color: #ea7af4; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .stat-pill { font-size: 11px; color: var(--color-text-secondary); border: 1px solid var(--color-border-tertiary); border-radius: 2px; padding: 3px 8px; }
    .stat-pill span { color: #ea7af4; font-weight: 500; }
    #aave-canvas { width: 100%; height: 420px; position: relative; overflow: hidden; border: 1px solid rgba(106,62,183,0.3); border-radius: 2px; background: rgba(0,0,0,0.4); }
    #aave-canvas svg { position: absolute; top:0; left:0; width:100%; height:100%; }
    .tooltip { position: absolute; pointer-events: none; background: rgba(10,5,20,0.95); border: 1px solid #6a3eb7; border-radius: 2px; padding: 6px 10px; font-size: 11px; color: #f1f1f1; line-height: 1.6; z-index: 10; display: none; max-width: 160px; }
    .tooltip strong { color: #ea7af4; }
  </style>
</head>
<body>
  <div class="container">
    <div class="archive-notice">Archive · Visualization</div>
    <h1>AAVE Word Distribution</h1>
    <p class="subtitle">African American Vernacular English · Comedy Scripts Analysis · Pratt Institute MS DAV</p>

    <div class="aave-viz">
      <div class="ctrl-row" id="movie-btns"></div>
      <div class="ctrl-row">
        <div class="stats-row" id="stats-row"></div>
        <div class="view-toggle">
          <button class="view-btn active" onclick="setView('bubble')">bubbles</button>
          <button class="view-btn" onclick="setView('cloud')">cloud</button>
          <button class="view-btn" onclick="setView('bar')">bars</button>
        </div>
      </div>
      <div id="aave-canvas">
        <svg id="viz-svg"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script>
  const MOVIES = [
    { id: 0, title: "Tropic Thunder", year: 2008, totalWords: 21331, aaveCount: 157, density: 0.74, unique: 36,
      terms: [["if",37],["real",19],["been",19],["fire",10],["mean",10],["bank",4],["beat",6],["bet",5],["cap",3],["carry",4],["cat",2],["chill",4],["din",1],["done",5],["drag",3],["drop",5],["dry",2],["fierce",3],["g",4],["heated",2],["hit",7],["link",2],["mad",5],["mans",4],["n",6],["playin",2],["plug",3],["read",3],["roll",4],["school",6],["serve",2],["slumped",1],["tea",3],["thick",2],["trip",3],["vibe",2]]},
    { id: 1, title: "Next Friday", year: 2000, totalWords: 15665, aaveCount: 111, density: 0.71, unique: 25,
      terms: [["if",25],["imma",24],["hit",13],["been",9],["real",6],["bank",3],["beat",5],["boss",4],["drop",4],["extra",2],["fire",4],["ghetto",3],["ice",3],["laid",2],["mad",4],["mean",5],["n",3],["roll",4],["school",5],["snatched",1],["thick",2],["tight",3],["trash",2],["trip",2],["wig",1]]},
    { id: 2, title: "Superbad", year: 2007, totalWords: 15665, aaveCount: 111, density: 0.71, unique: 25,
      terms: [["if",25],["imma",24],["hit",13],["been",9],["real",6],["bank",3],["beat",5],["boss",4],["drop",4],["extra",2],["fire",4],["ghetto",3],["ice",3],["laid",2],["mad",4],["mean",5],["n",3],["roll",4],["school",5],["snatched",1],["thick",2],["tight",3],["trash",2],["trip",2],["wig",1]]},
    { id: 3, title: "Bridesmaids", year: 2011, totalWords: 15665, aaveCount: 111, density: 0.71, unique: 25,
      terms: [["if",25],["imma",24],["hit",13],["been",9],["real",6],["bank",3],["beat",5],["boss",4],["drop",4],["extra",2],["fire",4],["ghetto",3],["ice",3],["laid",2],["mad",4],["mean",5],["n",3],["roll",4],["school",5],["snatched",1],["thick",2],["tight",3],["trash",2],["trip",2],["wig",1]]},
    { id: 4, title: "Hot Tub TM", year: 2010, totalWords: 15665, aaveCount: 111, density: 0.71, unique: 25,
      terms: [["if",25],["imma",24],["hit",13],["been",9],["real",6],["bank",3],["beat",5],["boss",4],["drop",4],["extra",2],["fire",4],["ghetto",3],["ice",3],["laid",2],["mad",4],["mean",5],["n",3],["roll",4],["school",5],["snatched",1],["thick",2],["tight",3],["trash",2],["trip",2],["wig",1]]},
    { id: 5, title: "Pineapple Exp.", year: 2008, totalWords: 21970, aaveCount: 149, density: 0.68, unique: 25,
      terms: [["if",41],["cop",20],["been",18],["hit",14],["school",9],["ate",2],["beat",5],["bet",4],["chill",5],["done",4],["dope",3],["drag",3],["fire",5],["kush",2],["lit",3],["mad",6],["mans",3],["mean",5],["n",4],["read",2],["real",5],["serve",2],["slumped",1],["tea",3],["thick",2]]},
    { id: 6, title: "Harold & Kumar", year: 2004, totalWords: 25891, aaveCount: 153, density: 0.59, unique: 28,
      terms: [["if",43],["been",31],["hit",15],["cop",13],["school",9],["beat",5],["beef",3],["carry",3],["chill",4],["dime",2],["done",5],["drag",3],["drop",4],["dry",2],["extra",2],["filthy",2],["fire",4],["laid",2],["lit",3],["mad",5],["mans",4],["mean",5],["n",3],["read",2],["roll",3],["thick",2],["trip",2],["vibe",1]]},
    { id: 7, title: "Scott Pilgrim", year: 2010, totalWords: 24627, aaveCount: 121, density: 0.49, unique: 26,
      terms: [["if",46],["been",16],["school",12],["mean",8],["hit",5],["beat",4],["beef",3],["bet",3],["coin",2],["done",4],["drop",4],["dry",2],["fierce",2],["fire",3],["homies",2],["mad",4],["n",3],["period",1],["pressed",2],["racks",1],["read",2],["real",3],["shade",1],["tea",2],["trash",2],["woke",1]]},
    { id: 8, title: "Ted", year: 2012, totalWords: 26819, aaveCount: 130, density: 0.48, unique: 29,
      terms: [["if",41],["been",23],["mean",8],["hit",8],["beat",4],["boss",4],["carry",3],["chill",5],["cop",4],["done",5],["drag",3],["drop",4],["extra",2],["g",3],["ice",2],["lit",3],["mans",4],["n",4],["plug",2],["read",3],["real",5],["roll",3],["school",7],["shook",1],["tight",3],["trash",2],["wig",1],["woke",2],["bet",2]]},
    { id: 9, title: "The Hangover", year: 2009, totalWords: 20568, aaveCount: 86, density: 0.42, unique: 22,
      terms: [["if",29],["been",15],["real",6],["tight",5],["beat",4],["bank",3],["bet",3],["boss",4],["coin",2],["done",4],["filthy",2],["fire",3],["g",2],["hit",5],["ice",3],["laid",2],["mad",4],["mans",3],["mean",4],["pressed",2],["roll",3],["school",4]]},
  ];

  let currentMovie = MOVIES[0];
  let currentView = 'bubble';
  let sim = null;

  function renderMovieBtns() {
    const c = document.getElementById('movie-btns');
    c.innerHTML = MOVIES.map(m =>
      `<button class="movie-btn${m.id===currentMovie.id?' active':''}" onclick="selectMovie(${m.id})">${m.title}</button>`
    ).join('');
  }

  function renderStats() {
    const m = currentMovie;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-pill">total words: <span>${m.totalWords.toLocaleString()}</span></div>
      <div class="stat-pill">aave terms: <span>${m.aaveCount}</span></div>
      <div class="stat-pill">density: <span>${m.density.toFixed(2)}%</span></div>
      <div class="stat-pill">unique: <span>${m.unique}</span></div>
    `;
  }

  function selectMovie(id) {
    currentMovie = MOVIES[id];
    renderMovieBtns();
    renderStats();
    renderView();
  }

  function setView(v) {
    currentView = v;
    document.querySelectorAll('.view-btn').forEach((b,i) => {
      b.classList.toggle('active', ['bubble','cloud','bar'][i] === v);
    });
    renderView();
  }

  function renderView() {
    if (sim) { sim.stop(); sim = null; }
    if (currentView === 'bubble') renderBubble();
    else if (currentView === 'cloud') renderCloud();
    else renderBar();
  }

  const W = () => document.getElementById('aave-canvas').clientWidth || 700;
  const H = 420;
  const pink = '#ea7af4';
  const pinkDim = '#a611b1';

  function getSvg() {
    const svg = d3.select('#viz-svg');
    svg.selectAll('*').remove();
    svg.attr('viewBox', `0 0 ${W()} ${H}`);
    return svg;
  }

  function showTip(event, html) {
    const t = document.getElementById('tooltip');
    t.innerHTML = html;
    t.style.display = 'block';
    const box = document.getElementById('aave-canvas').getBoundingClientRect();
    let x = event.clientX - box.left + 12;
    let y = event.clientY - box.top + 12;
    if (x + 170 > W()) x -= 180;
    if (y + 80 > H) y -= 80;
    t.style.left = x + 'px';
    t.style.top = y + 'px';
  }
  function hideTip() { document.getElementById('tooltip').style.display = 'none'; }

  function renderBubble() {
    const svg = getSvg();
    const w = W();
    const terms = currentMovie.terms;
    const maxCount = d3.max(terms, d => d[1]);
    const rScale = d3.scaleSqrt().domain([1, maxCount]).range([10, 52]);
    const colorScale = d3.scaleSequential().domain([1, maxCount]).interpolator(t => d3.interpolateRgb('#2d1060', '#ea7af4')(t));

    const nodes = terms.map(([word, count]) => ({ word, count, r: rScale(count) }));

    sim = d3.forceSimulation(nodes)
      .force('charge', d3.forceManyBody().strength(5))
      .force('center', d3.forceCenter(w / 2, H / 2))
      .force('collision', d3.forceCollide(d => d.r + 3))
      .force('x', d3.forceX(w / 2).strength(0.06))
      .force('y', d3.forceY(H / 2).strength(0.08));

    const g = svg.append('g');
    const node = g.selectAll('g.node')
      .data(nodes).join('g').attr('class', 'node').style('cursor', 'pointer');

    node.append('circle')
      .attr('r', d => d.r)
      .attr('fill', d => colorScale(d.count))
      .attr('stroke', d => d.count === maxCount ? pink : 'rgba(234,122,244,0.3)')
      .attr('stroke-width', d => d.count === maxCount ? 2 : 1);

    node.append('text')
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
      .attr('font-family', 'Monaco, monospace')
      .attr('font-size', d => Math.min(d.r * 0.55, 14) + 'px')
      .attr('fill', d => d.r < 18 ? 'rgba(241,241,241,0.7)' : '#f1f1f1')
      .attr('pointer-events', 'none')
      .text(d => d.r < 12 ? '' : d.word);

    node.on('mousemove', function(event, d) {
      showTip(event, `<strong>${d.word}</strong><br>count: ${d.count}<br>rank: #${currentMovie.terms.findIndex(t=>t[0]===d.word)+1}`);
    }).on('mouseleave', hideTip);

    sim.on('tick', () => {
      node.attr('transform', d => {
        d.x = Math.max(d.r+2, Math.min(w-d.r-2, d.x));
        d.y = Math.max(d.r+2, Math.min(H-d.r-2, d.y));
        return `translate(${d.x},${d.y})`;
      });
    });
  }

  function renderCloud() {
    const svg = getSvg();
    const w = W();
    const terms = currentMovie.terms;
    const maxCount = d3.max(terms, d => d[1]);
    const fsScale = d3.scaleSqrt().domain([1, maxCount]).range([11, 52]);
    const colorScale = d3.scaleSequential().domain([1, maxCount]).interpolator(t => d3.interpolateRgb(pinkDim, pink)(t));

    const placed = [];
    const cx = w/2, cy = H/2;
    const sorted = [...terms].sort((a,b) => b[1]-a[1]);

    svg.append('rect').attr('width', w).attr('height', H).attr('fill', 'transparent');

    let angle = 0;
    const spiral = (i) => {
      const r = 2.5 * i;
      angle += 0.35;
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    };

    const g = svg.append('g');
    sorted.forEach(([word, count], i) => {
      const fs = fsScale(count);
      const charW = fs * 0.62;
      const tw = word.length * charW;
      const th = fs * 1.2;
      let [px, py] = i === 0 ? [cx, cy] : spiral(i * 6);
      let tries = 0;
      while (tries < 200) {
        let ok = true;
        for (const p of placed) {
          if (Math.abs(px - p.x) < (tw + p.tw)/2 + 3 && Math.abs(py - p.y) < (th + p.th)/2 + 3) { ok = false; break; }
        }
        if (ok && px > tw/2+4 && px < w-tw/2-4 && py > th/2+4 && py < H-th/2-4) break;
        const [nx, ny] = spiral(i * 6 + tries);
        px = nx; py = ny;
        tries++;
      }
      placed.push({ x: px, y: py, tw, th });

      g.append('text')
        .attr('x', px).attr('y', py)
        .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
        .attr('font-family', 'Monaco, monospace')
        .attr('font-size', fs + 'px')
        .attr('fill', colorScale(count))
        .attr('opacity', 0.9)
        .style('cursor', 'pointer')
        .text(word)
        .on('mousemove', function(event) {
          showTip(event, `<strong>${word}</strong><br>count: ${count}`);
        }).on('mouseleave', hideTip);
    });
  }

  function renderBar() {
    const svg = getSvg();
    const w = W();
    const terms = [...currentMovie.terms].sort((a,b) => b[1]-a[1]).slice(0, 20);
    const margin = { top: 14, right: 20, bottom: 36, left: 64 };
    const iw = w - margin.left - margin.right;
    const ih = H - margin.top - margin.bottom;

    const x = d3.scaleLinear().domain([0, d3.max(terms, d=>d[1])]).range([0, iw]);
    const y = d3.scaleBand().domain(terms.map(d=>d[0])).range([0, ih]).padding(0.25);

    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const colorScale = d3.scaleSequential().domain([0, terms.length]).interpolator(t => d3.interpolateRgb('#2d1060','#ea7af4')(t));

    g.selectAll('rect').data(terms).join('rect')
      .attr('y', d => y(d[0])).attr('height', y.bandwidth())
      .attr('x', 0).attr('width', d => x(d[1]))
      .attr('fill', (d,i) => colorScale(i)).attr('rx', 1)
      .style('cursor', 'pointer')
      .on('mousemove', function(event, d) {
        showTip(event, `<strong>${d[0]}</strong><br>count: ${d[1]}`);
      }).on('mouseleave', hideTip);

    g.selectAll('text.val').data(terms).join('text')
      .attr('class', 'val')
      .attr('x', d => x(d[1]) + 5).attr('y', d => y(d[0]) + y.bandwidth()/2)
      .attr('dominant-baseline', 'central')
      .attr('font-family', 'Monaco, monospace').attr('font-size', '11px')
      .attr('fill', 'rgba(241,241,241,0.6)').text(d => d[1]);

    const yAxis = g.append('g').call(d3.axisLeft(y).tickSize(0).tickPadding(8));
    yAxis.select('.domain').remove();
    yAxis.selectAll('text').attr('font-family','Monaco,monospace').attr('font-size','11px').attr('fill','rgba(241,241,241,0.75)');

    const xAxis = g.append('g').attr('transform', `translate(0,${ih})`).call(d3.axisBottom(x).ticks(5).tickSize(-ih));
    xAxis.select('.domain').remove();
    xAxis.selectAll('.tick line').attr('stroke','rgba(106,62,183,0.25)').attr('stroke-dasharray','2,2');
    xAxis.selectAll('text').attr('font-family','Monaco,monospace').attr('font-size','11px').attr('fill','rgba(241,241,241,0.5)');
  }

  renderMovieBtns();
  renderStats();
  renderView();
  window.addEventListener('resize', () => {
    if (sim) sim.stop();
    renderView();
  });
  </script>
</body>
</html>
