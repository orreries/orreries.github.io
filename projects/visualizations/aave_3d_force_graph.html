
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { background: transparent; overflow: hidden; }
  #graph-container {
    width: 100%;
    height: 560px;
    position: relative;
    background: #050008;
    border-radius: 8px;
    overflow: hidden;
  }
  #graph-container canvas { border-radius: 8px; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(10,0,20,0.92);
    border: 1px solid #6a3eb7;
    border-radius: 4px;
    padding: 8px 12px;
    font-family: Monaco, monospace;
    font-size: 11px;
    color: #f1f1f1;
    max-width: 220px;
    z-index: 100;
    display: none;
    line-height: 1.6;
  }
  #tooltip .tt-title { color: #ea7af4; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  #tooltip .tt-row { color: #b8a0d8; }
  #tooltip .tt-val { color: #f1f1f1; }

  #legend {
    position: absolute;
    bottom: 14px;
    left: 14px;
    font-family: Monaco, monospace;
    font-size: 10px;
    color: #b8a0d8;
    line-height: 2;
    pointer-events: none;
  }
  .leg-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  #controls {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: Monaco, monospace;
    font-size: 10px;
    color: #6a3eb7;
    text-align: right;
    pointer-events: none;
    line-height: 1.8;
  }

  #filter-bar {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: 320px;
  }
  .filter-btn {
    font-family: Monaco, monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 2px;
    border: 1px solid #6a3eb7;
    background: rgba(10,0,20,0.85);
    color: #b8a0d8;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: rgba(106,62,183,0.35);
    color: #ea7af4;
    border-color: #ea7af4;
  }
</style>

<h2 class="sr-only" style="position:absolute;left:-9999px">3D force-directed graph of AAVE NLP analysis data showing movies, shared AAVE terms, and semantic similarity connections to tweets</h2>

<div id="graph-container">
  <div id="tooltip"></div>
  <div id="legend">
    <div><span class="leg-dot" style="background:#ea7af4"></span>Movie</div>
    <div><span class="leg-dot" style="background:#7ecfc1"></span>AAVE Term</div>
    <div><span class="leg-dot" style="background:#ffb49a"></span>Tweet cluster</div>
    <div style="margin-top:4px;color:#444;border-top:1px solid #222;padding-top:4px">
      Link brightness = cosine sim
    </div>
  </div>
  <div id="controls">
    drag · scroll to zoom<br>click node for detail
  </div>
  <div id="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">all</button>
    <button class="filter-btn" data-filter="movie" onclick="setFilter('movie',this)">movies</button>
    <button class="filter-btn" data-filter="term" onclick="setFilter('term',this)">top terms</button>
    <button class="filter-btn" data-filter="tweet" onclick="setFilter('tweet',this)">tweet clusters</button>
  </div>
</div>

<script src="https://unpkg.com/3d-force-graph@1.70.10/dist/3d-force-graph.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MOVIE_COLOR   = '#ea7af4';
const TERM_COLOR    = '#7ecfc1';
const TWEET_COLOR   = '#ffb49a';
const LINK_INACTIVE = 'rgba(106,62,183,0.15)';

const movies = [
  { id:'tropic_thunder',   label:'Tropic Thunder',    density:0.74, cosine:0.1872, unique:36, year:2008 },
  { id:'next_friday',      label:'Next Friday',       density:0.71, cosine:0.2208, unique:25, year:2000 },
  { id:'superbad',         label:'Superbad',          density:0.71, cosine:0.2013, unique:25, year:2007 },
  { id:'bridesmaids',      label:'Bridesmaids',       density:0.71, cosine:0.2217, unique:25, year:2011 },
  { id:'httm',             label:'Hot Tub TM',        density:0.71, cosine:0.2040, unique:25, year:2010 },
  { id:'pineapple',        label:'Pineapple Express', density:0.68, cosine:0.1743, unique:25, year:2008 },
  { id:'harold_kumar',     label:'Harold & Kumar',    density:0.59, cosine:0.0892, unique:28, year:2004 },
  { id:'scott_pilgrim',    label:'Scott Pilgrim',     density:0.49, cosine:0.1146, unique:26, year:2010 },
  { id:'ted',              label:'Ted',               density:0.48, cosine:0.1471, unique:29, year:2012 },
  { id:'hangover',         label:'The Hangover',      density:0.42, cosine:0.0892, unique:22, year:2009 },
];

const topTerms = [
  { id:'t_if',    label:'"if"',    freq:37 },
  { id:'t_been',  label:'"been"',  freq:25 },
  { id:'t_hit',   label:'"hit"',   freq:14 },
  { id:'t_real',  label:'"real"',  freq:13 },
  { id:'t_fire',  label:'"fire"',  freq:10 },
  { id:'t_cop',   label:'"cop"',   freq:9  },
  { id:'t_mean',  label:'"mean"',  freq:9  },
  { id:'t_school',label:'"school"',freq:9  },
  { id:'t_mad',   label:'"mad"',   freq:8  },
  { id:'t_imma',  label:'"imma"',  freq:8  },
  { id:'t_drop',  label:'"drop"',  freq:7  },
  { id:'t_boss',  label:'"boss"',  freq:5  },
];

const tweetClusters = [
  { id:'tw_oscars',   label:'#OscarsSoWhite', topSim:0.36 },
  { id:'tw_thanksgiving', label:'#ThanksgivingClapback', topSim:0.36 },
  { id:'tw_friday',   label:'Black Friday tweets', topSim:0.35 },
  { id:'tw_family',   label:'Family clapbacks', topSim:0.34 },
];

const movieTermLinks = {
  tropic_thunder:   ['t_if','t_real','t_fire','t_been','t_mean','t_hit'],
  next_friday:      ['t_if','t_imma','t_hit','t_been','t_real'],
  superbad:         ['t_if','t_imma','t_hit','t_been','t_real'],
  bridesmaids:      ['t_if','t_imma','t_hit','t_been','t_real'],
  httm:             ['t_if','t_imma','t_hit','t_been','t_real'],
  pineapple:        ['t_if','t_cop','t_been','t_hit','t_school'],
  harold_kumar:     ['t_if','t_been','t_hit','t_cop','t_school'],
  scott_pilgrim:    ['t_if','t_been','t_school','t_mean','t_hit'],
  ted:              ['t_if','t_been','t_mean','t_hit','t_boss'],
  hangover:         ['t_if','t_been','t_real','t_mad'],
};

const movieTweetLinks = {
  next_friday:    { cluster:'tw_friday',       sim:0.2208 },
  superbad:       { cluster:'tw_oscars',       sim:0.2013 },
  bridesmaids:    { cluster:'tw_oscars',       sim:0.2217 },
  hangover:       { cluster:'tw_thanksgiving', sim:0.2339 },
  httm:           { cluster:'tw_family',       sim:0.2040 },
  harold_kumar:   { cluster:'tw_oscars',       sim:0.0892 },
  scott_pilgrim:  { cluster:'tw_thanksgiving', sim:0.1146 },
  pineapple:      { cluster:'tw_oscars',       sim:0.1743 },
  ted:            { cluster:'tw_oscars',       sim:0.1471 },
  tropic_thunder: { cluster:'tw_oscars',       sim:0.1872 },
};

function buildGraph(filter) {
  let nodes = [], links = [];
  const addMovies = filter === 'all' || filter === 'movie' || filter === 'term' || filter === 'tweet';
  const addTerms  = filter === 'all' || filter === 'term';
  const addTweets = filter === 'all' || filter === 'tweet';

  if(addMovies) {
    movies.forEach(m => nodes.push({
      id: m.id, label: m.label, type:'movie',
      val: 4 + m.density * 8,
      density: m.density, cosine: m.cosine, unique: m.unique, year: m.year
    }));
  }
  if(addTerms) {
    topTerms.forEach(t => nodes.push({
      id: t.id, label: t.label, type:'term', val: 2 + t.freq * 0.3, freq: t.freq
    }));
    if(addMovies) {
      movies.forEach(m => {
        (movieTermLinks[m.id] || []).forEach(tid => {
          links.push({ source: m.id, target: tid, type:'term', strength:0.4 });
        });
      });
    }
  }
  if(addTweets) {
    tweetClusters.forEach(tc => nodes.push({
      id: tc.id, label: tc.label, type:'tweet', val: 3 + tc.topSim * 12, topSim: tc.topSim
    }));
    if(addMovies) {
      movies.forEach(m => {
        const link = movieTweetLinks[m.id];
        if(link) links.push({ source: m.id, target: link.cluster, type:'tweet', sim: link.sim, strength: link.sim * 3 });
      });
    }
  }
  if(filter === 'movie') {
    movies.forEach((m1,i) => movies.forEach((m2,j) => {
      if(j <= i) return;
      const shared = (movieTermLinks[m1.id]||[]).filter(t => (movieTermLinks[m2.id]||[]).includes(t));
      if(shared.length >= 3) links.push({ source:m1.id, target:m2.id, type:'shared', shared:shared.length });
    }));
  }
  return { nodes, links };
}

let currentFilter = 'all';
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const { nodes, links } = buildGraph(f);
  Graph.graphData({ nodes, links });
}

const container = document.getElementById('graph-container');
const W = container.clientWidth, H = container.clientHeight;

const Graph = ForceGraph3D()(container)
  .width(W).height(H)
  .backgroundColor('#050008')
  .showNavInfo(false)

  .graphData(buildGraph('all'))

  .nodeLabel(() => '')
  .nodeVal(n => n.val)
  .nodeColor(n =>
    n.type === 'movie' ? MOVIE_COLOR :
    n.type === 'term'  ? TERM_COLOR  :
    TWEET_COLOR
  )
  .nodeOpacity(0.95)
  .nodeResolution(16)

  .linkColor(l => {
    if(l.type === 'tweet') {
      const alpha = Math.round(40 + (l.sim||0.1) * 200);
      return `rgba(255,180,154,${(alpha/255).toFixed(2)})`;
    }
    if(l.type === 'term')   return 'rgba(126,207,193,0.22)';
    if(l.type === 'shared') return `rgba(106,62,183,${Math.min(0.8,(l.shared||1)*0.12)})`;
    return LINK_INACTIVE;
  })
  .linkWidth(l => l.type === 'tweet' ? 1.5 + (l.sim||0)*4 : l.type==='shared' ? 1 : 0.5)
  .linkOpacity(0.8)
  .linkDirectionalParticles(l => l.type==='tweet' ? 3 : l.type==='term' ? 1 : 0)
  .linkDirectionalParticleWidth(l => l.type==='tweet' ? 1.5 : 0.8)
  .linkDirectionalParticleColor(l => l.type==='tweet' ? '#ffb49a' : '#7ecfc1')
  .linkDirectionalParticleSpeed(l => l.type==='tweet' ? 0.005 + (l.sim||0)*0.01 : 0.004)

  .onNodeHover(node => {
    const tt = document.getElementById('tooltip');
    if(!node) { tt.style.display='none'; return; }
    let html = `<div class="tt-title">${node.label}</div>`;
    if(node.type==='movie') {
      html += `<div class="tt-row">Year: <span class="tt-val">${node.year}</span></div>`;
      html += `<div class="tt-row">AAVE density: <span class="tt-val">${node.density.toFixed(2)}%</span></div>`;
      html += `<div class="tt-row">Cosine sim: <span class="tt-val">${node.cosine.toFixed(4)}</span></div>`;
      html += `<div class="tt-row">Unique terms: <span class="tt-val">${node.unique}</span></div>`;
    } else if(node.type==='term') {
      html += `<div class="tt-row">Avg frequency: <span class="tt-val">${node.freq}</span></div>`;
      html += `<div class="tt-row">Appears across all 10 scripts</span></div>`;
    } else {
      html += `<div class="tt-row">Top cosine sim: <span class="tt-val">${node.topSim.toFixed(4)}</span></div>`;
    }
    tt.innerHTML = html;
    tt.style.display = 'block';
  })
  .onNodeClick(node => {
    const labels = { movie:'Tell me more about AAVE analysis in '+node.label, term:'Why does the term '+node.label+' appear so frequently in AAVE NLP analysis?', tweet:'Tell me more about the '+node.label+' tweet cluster in the AAVE study' };
    const msg = labels[node.type];
    if(msg) sendPrompt(msg);
  });

container.addEventListener('mousemove', e => {
  const tt = document.getElementById('tooltip');
  if(tt.style.display === 'block') {
    tt.style.left = (e.offsetX + 14) + 'px';
    tt.style.top  = (e.offsetY + 14) + 'px';
  }
});

Graph.d3Force('charge').strength(-120);
Graph.d3Force('link').distance(l =>
  l.type==='tweet' ? 80 : l.type==='term' ? 50 : 40
);

setTimeout(() => {
  Graph.cameraPosition({ x:0, y:0, z:320 }, { x:0,y:0,z:0 }, 2000);
}, 100);
</script>
